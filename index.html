<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT & Office Needs Request System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
}

body {
  background: linear-gradient(145deg, #eef5fc, #dbeafe);
  min-height: 100vh;
  padding: 2rem 1rem;
  display: flex;
  justify-content: center;
  align-items: center;
}

.request-card {
  max-width: 1000px;
  width: 100%;
  background: white;
  border-radius: 2.5rem;
  box-shadow: 0 25px 50px -12px rgba(0,30,60,.25);
  padding: 2.5rem 2.8rem;
}

h1 {
  display: flex;
  align-items: center;
  gap: .8rem;
  font-size: 2.2rem;
  color: #0a2b4b;
  margin-bottom: .5rem;
}

h1 i {
  color: #1e6f9f;
  background: #e1effa;
  padding: .6rem;
  border-radius: 1rem;
}

.subhead {
  color: #2c5778;
  font-size: 1.05rem;
  margin-bottom: 2rem;
  border-left: 5px solid #3b8fc2;
  padding: 1rem;
  background: #f0f7fe;
  border-radius: 0 1rem 1rem 0;
}

.role-section {
  display: flex;
  flex-wrap: wrap;
  gap: 1.2rem;
  background: #f3f9ff;
  padding: 1.3rem;
  border-radius: 2rem;
  margin-bottom: 2rem;
  align-items: center;
}

.role-label {
  font-weight: 600;
  color: #0f3d5e;
}

.role-options {
  display: flex;
  flex-wrap: wrap;
  gap: .8rem;
}

.role-options label {
  display: flex;
  align-items: center;
  gap: .5rem;
  background: white;
  padding: .65rem 1rem;
  border-radius: 2rem;
  border: 1px solid #cde0f0;
  cursor: pointer;
  color: #1d3d5c;
}

input[type="radio"],
input[type="checkbox"] {
  accent-color: #1e7bb0;
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.section-title {
  font-weight: 700;
  color: #0a2b4b;
  margin-bottom: 1rem;
}

.facility-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.facility-item {
  background: white;
  border: 1.5px solid #d9e6f2;
  border-radius: 1.5rem;
  padding: 1rem;
  display: flex;
  align-items: center;
  gap: .8rem;
  cursor: pointer;
  transition: .2s;
}

.facility-item:hover {
  border-color: #7ab3d9;
  background: #f6fcff;
}

.facility-item:has(input:checked) {
  background: #eaf5ff;
  border-color: #1e7bb0;
}

.facility-icon {
  font-size: 1.5rem;
  color: #1f6fa0;
}

.facility-text {
  display: flex;
  flex-direction: column;
}

.facility-name {
  font-weight: 600;
  color: #10374f;
  font-size: .95rem;
}

.facility-hint {
  font-size: .75rem;
  color: #5a7e9b;
}

.details-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1.2rem;
  margin: 2rem 0;
  background: #f9fcff;
  padding: 1.6rem;
  border-radius: 2rem;
  border: 1px solid #d2e3f2;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}

.input-group label,
.additional-area label {
  font-weight: 600;
  color: #165072;
  font-size: .85rem;
}

.input-group input {
  padding: .85rem 1rem;
  border-radius: 1.5rem;
  border: 1.5px solid #c2d9ec;
  background: white;
  font-size: .95rem;
  width: 100%;
}

.input-group input:focus,
textarea:focus {
  outline: none;
  border-color: #1e7bb0;
  box-shadow: 0 0 0 3px rgba(30,123,176,.12);
}

.additional-area {
  margin-bottom: 2rem;
}

.additional-area label {
  display: block;
  margin-bottom: .7rem;
}

textarea {
  width: 100%;
  padding: 1.2rem;
  border-radius: 1.5rem;
  border: 1.5px solid #c2d9ec;
  resize: vertical;
  font-size: .95rem;
  min-height: 100px;
}

.submit-btn {
  background: #0f3d5e;
  color: white;
  border: none;
  padding: 1.2rem;
  border-radius: 3rem;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  width: 100%;
  transition: .2s;
}

.submit-btn:hover {
  background: #1b537c;
}

.submit-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.feedback {
  display: none;
  margin-top: 1.5rem;
  padding: 1rem;
  border-radius: 1rem;
  text-align: center;
  font-weight: 500;
}

.feedback.success {
  display: block;
  background: #dff0e3;
  color: #1a5c3a;
  border: 1px solid #a9d9b8;
}

.feedback.error {
  display: block;
  background: #ffe6e6;
  color: #a12b2b;
  border: 1px solid #e6b3b3;
}

.small-note {
  text-align: center;
  margin-top: 1.5rem;
  color: #537d9c;
  font-size: .8rem;
}

@media(max-width:600px) {
  .request-card {
    padding: 1.5rem;
    border-radius: 1.5rem;
  }
  h1 {
    font-size: 1.6rem;
  }
  .facility-grid {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }
  .facility-item {
    padding: .7rem;
    gap: .5rem;
  }
  .facility-icon {
    font-size: 1.2rem;
  }
}
</style>
</head>

<body>

<div class="request-card">

<h1>
<i class="fas fa-clipboard-list"></i>
ICT & Office Needs
</h1>

<div class="subhead">
Academic · Technician · Administrator —
Request facilities for your office
</div>

<form id="requestForm">

<div class="role-section">
<span class="role-label">
<i class="fas fa-user-tag"></i> I am a:
</span>

<div class="role-options">
<label>
<input type="radio" name="role" value="academic" checked>
<i class="fas fa-chalkboard-teacher"></i> Academic
</label>

<label>
<input type="radio" name="role" value="technician">
<i class="fas fa-tools"></i> Technician
</label>

<label>
<input type="radio" name="role" value="administrator">
<i class="fas fa-user-tie"></i> Administrator
</label>
</div>
</div>

<div class="section-title">
<i class="fas fa-couch"></i> Select needed facilities:
</div>

<div class="facility-grid">

<label class="facility-item">
<input type="checkbox" name="facility" value="Ergonomic chair">
<span class="facility-icon"><i class="fas fa-chair"></i></span>
<span class="facility-text">
<span class="facility-name">Office chair</span>
<span class="facility-hint">ergonomic / standard</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Desktop PC">
<span class="facility-icon"><i class="fas fa-desktop"></i></span>
<span class="facility-text">
<span class="facility-name">Desktop PC</span>
<span class="facility-hint">i5 / i7, RAM</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Laptop">
<span class="facility-icon"><i class="fas fa-laptop"></i></span>
<span class="facility-text">
<span class="facility-name">Laptop</span>
<span class="facility-hint">Windows / macOS</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Monitor">
<span class="facility-icon"><i class="fas fa-tv"></i></span>
<span class="facility-text">
<span class="facility-name">Monitor</span>
<span class="facility-hint">24 / 27 inch FHD</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Printer">
<span class="facility-icon"><i class="fas fa-print"></i></span>
<span class="facility-text">
<span class="facility-name">Printer</span>
<span class="facility-hint">laser / inkjet</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Keyboard & Mouse">
<span class="facility-icon"><i class="fas fa-keyboard"></i></span>
<span class="facility-text">
<span class="facility-name">Keyboard + mouse</span>
<span class="facility-hint">wired / wireless</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Office desk">
<span class="facility-icon"><i class="fas fa-table"></i></span>
<span class="facility-text">
<span class="facility-name">Office desk</span>
<span class="facility-hint">standing / standard</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Network / Wi-Fi">
<span class="facility-icon"><i class="fas fa-wifi"></i></span>
<span class="facility-text">
<span class="facility-name">Network / Wi-Fi</span>
<span class="facility-hint">ethernet / access point</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Headset">
<span class="facility-icon"><i class="fas fa-headset"></i></span>
<span class="facility-text">
<span class="facility-name">Headset</span>
<span class="facility-hint">with microphone</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="Projector">
<span class="facility-icon"><i class="fas fa-video"></i></span>
<span class="facility-text">
<span class="facility-name">Projector</span>
<span class="facility-hint">HD / portable</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="External HDD / SSD">
<span class="facility-icon"><i class="fas fa-hdd"></i></span>
<span class="facility-text">
<span class="facility-name">External storage</span>
<span class="facility-hint">HDD / SSD</span>
</span>
</label>

<label class="facility-item">
<input type="checkbox" name="facility" value="UPS">
<span class="facility-icon"><i class="fas fa-battery-full"></i></span>
<span class="facility-text">
<span class="facility-name">UPS</span>
<span class="facility-hint">backup power</span>
</span>
</label>

</div>

<div class="details-section">

<div class="input-group">
<label for="officeInput">
<i class="fas fa-building"></i> Office / Room
</label>
<input type="text" id="officeInput"
placeholder="e.g., Room 204, Science Bldg"
required maxlength="150">
</div>

<div class="input-group">
<label for="nameInput">
<i class="fas fa-user"></i> Your name
</label>
<input type="text" id="nameInput"
placeholder="Full name"
required maxlength="150">
</div>

<div class="input-group">
<label for="emailInput">
<i class="fas fa-envelope"></i> Email
</label>
<input type="email" id="emailInput"
placeholder="name@institution.edu"
required maxlength="254">
</div>

</div>

<div class="additional-area">
<label for="otherNeeds">
<i class="fas fa-pen"></i> Other needs / specifications
</label>

<textarea id="otherNeeds"
placeholder="e.g., software licenses, PC specifications, installation requests, extra chairs..."
maxlength="3000"></textarea>
</div>

<button type="submit" class="submit-btn" id="submitBtn">
<i class="fas fa-paper-plane"></i>
<span id="submitText">Submit request</span>
</button>

<div class="feedback" id="feedbackMessage" role="status" aria-live="polite"></div>

<div class="small-note">
<i class="fas fa-shield-alt"></i>
This information will be sent to the ICT & facilities coordinator.
</div>

</form>
</div>

<script>

// ------------------------------------------------------------------
// CONFIGURATION — replace these two values, then deploy on Render.
// ------------------------------------------------------------------

// 1) Your Apps Script Web App /exec URL (the NEW deployment).
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw3lb4f2SDkHWAvRj6WB3YsYxMM-bAvQoytjgnkgiraIWuTdtVaXRy3LeD7EbnU5i_4Cg/exec";

// 2) The same secret you stored in Script Properties as SHARED_SECRET.
//    This is visible to anyone who views the page source, so it only
//    stops casual spam — it is not real authentication.
const SHARED_SECRET = "AKfycbw3lb4f2SDkHWAvRj6WB3YsYxMM-bAvQoytjgnkgiraIWuTdtVaXRy3LeD7EbnU5i_4Cg";

// ------------------------------------------------------------------

const form = document.getElementById("requestForm");
const submitBtn = document.getElementById("submitBtn");
const submitText = document.getElementById("submitText");
const feedback = document.getElementById("feedbackMessage");

function showFeedback(message, type) {
  feedback.textContent = message;
  feedback.className = "feedback " + type;
  feedback.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });
}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const name =
    document.getElementById("nameInput").value.trim();

  const email =
    document.getElementById("emailInput").value.trim();

  const office =
    document.getElementById("officeInput").value.trim();

  const otherNeeds =
    document.getElementById("otherNeeds").value.trim();

  const role =
    document.querySelector('input[name="role"]:checked').value;

  const facilities =
    Array.from(
      document.querySelectorAll('input[name="facility"]:checked')
    ).map(item => item.value);

  if (!name || !email || !office) {
    showFeedback(
      "Please complete your name, email and office.",
      "error"
    );
    return;
  }

  if (facilities.length === 0 && !otherNeeds) {
    showFeedback(
      "Please select at least one facility or describe your needs.",
      "error"
    );
    return;
  }

  const requestData = {
    secret: SHARED_SECRET,
    name: name,
    email: email,
    role: role,
    office: office,
    facilities: facilities,
    otherNeeds: otherNeeds
  };

  submitBtn.disabled = true;
  submitText.textContent = "Sending request...";
  feedback.className = "feedback";
  feedback.textContent = "";

  try {

    // text/plain keeps this a "simple request" so the browser does not
    // send a CORS preflight. Apps Script redirects to
    // script.googleusercontent.com, which does not answer preflights.
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(requestData)
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    if (result.status === "ok") {
      showFeedback(
        "Request submitted successfully. The ICT coordinator has been notified.",
        "success"
      );
      form.reset();
    } else {
      showFeedback(
        "The server could not save your request: " +
        (result.message || "unknown error"),
        "error"
      );
    }

  } catch (error) {

    console.error("Submission error:", error);

    showFeedback(
      "Unable to send your request. Check your connection and try again.",
      "error"
    );

  } finally {

    submitBtn.disabled = false;
    submitText.textContent = "Submit request";

  }

});

</script>

</body>
</html>
